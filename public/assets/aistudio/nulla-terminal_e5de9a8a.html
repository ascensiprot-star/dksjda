<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NULLA Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--a:#ffa21f;--a2:#e88a00;--w:#ececec;--g:#9a9a9a;--g2:#666;--l:#2a2a2a;--l2:#3b3b3b;--up:#2fd35f;--dn:#ff4b43;--cy:#42c6ff;--yl:#ffd60a;--bl:#1a6be0;--rd:#b3191f;--nb:#0a2282;--rh:21px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--w);overflow:hidden}
body{font:12.5px/1.25 'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
body.cp{--rh:18px;font-size:11.5px}
button,input,select{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--a)}
svg{display:block}
svg text{font:10.5px 'IBM Plex Mono',monospace;fill:#8f8f8f}
#t{display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr) auto;height:100vh}
.dim{color:var(--g)}.up{color:var(--up)}.dn{color:var(--dn)}.am{color:var(--a)}.cy{color:var(--cy)}.yl{color:var(--yl)}.wh{color:#fff}

/* command bar */
#bar1{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#000;position:relative;z-index:30}
#bar1 .nv{font-size:20px;line-height:1;padding:0 8px;color:#d8d8d8}
#bar1 .nv:hover{color:var(--a)}
.fld{display:flex;align-items:center;gap:10px;background:#262626;border:1px solid #4a4a4a;border-bottom-color:#8a8a8a;padding:3px 12px;font-size:15px;height:30px}
.fld input{width:68px;font-size:15px;text-transform:uppercase}
.fld.sec{min-width:230px;justify-content:space-between}
.fld.fn{width:92px}
.fld.rel{flex:0 0 auto}
.fld b{font-weight:400;color:#cfcfcf;font-size:11px}
.sp{flex:1}
.hb{display:flex;align-items:center;gap:6px;color:#d8d8d8;padding:0 8px;height:30px}
.hb:hover{color:var(--a)}
.hb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.qb{background:var(--yl);color:#000;font-weight:600;width:44px;height:30px;font-size:16px;display:grid;place-items:center}

/* tickers */
#tick1{display:flex;align-items:baseline;gap:14px;padding:2px 8px 0 4px;font-size:26px;line-height:1.15;white-space:nowrap;overflow:hidden}
#tick1 .cur{width:20px;height:30px;background:#6bb7ff;align-self:center;flex:none}
#tick1 .tk{font-weight:500;letter-spacing:.02em}
#tick1 .ba,#tick1 .qs{font-size:24px;color:#e6e6e6}
#tick1 svg{align-self:center}
#tick2{display:flex;align-items:center;gap:22px;padding:0 8px 4px 8px;font-size:21px;white-space:nowrap;overflow:hidden}
#tick2 .gl{width:34px;height:34px;border-radius:50%;background:var(--a);color:#000;display:grid;place-items:center;font-size:15px;flex:none}
#tick2 b{font-weight:400;color:var(--a)}
#tick2 .l{color:var(--a)}

/* red bar */
#bar2{display:flex;align-items:stretch;height:28px;font-size:16px}
#bar2 .id{background:var(--a);color:#000;padding:0 14px;display:flex;align-items:center;min-width:410px}
#bar2 button{background:#9c1a1f;padding:0 16px;color:#fff;border-left:1px solid #000;white-space:nowrap}
#bar2 button:hover{background:#c0252c}
#bar2 button i{font-style:normal;font-size:10px;margin-left:6px}
#bar2 .ttl{flex:1;background:#b3191f;text-align:right;padding:0 16px;display:flex;align-items:center;justify-content:flex-end;color:#fff}

/* main */
#main{min-height:0;display:flex;flex-direction:column;background:#000;position:relative}
.sr{display:flex;align-items:center;gap:16px;padding:3px 8px;font-size:15px;white-space:nowrap;overflow:hidden;flex:none;min-height:30px}
.sr .adj{background:#303030;border:1px solid #555;color:#fff;font-weight:600;padding:0 12px;font-size:14px}
.sr .qm{background:#fff;color:#000;font-style:normal;font-weight:700;padding:0 6px;margin-left:6px}
.ob{background:var(--a);color:#000;padding:0 10px;height:24px;appearance:none;cursor:pointer;border:1px solid #5a3a00;font-size:15px}
.ob.w{min-width:300px}
.ob option{background:#222;color:#fff}
.tabs{display:flex;flex:none;background:#0d0d0d;padding:2px 4px 0}
.tabs button{padding:3px 22px 3px 14px;margin-right:2px;color:#b0b0b0;background:#2b2b2b;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,0 100%);font-size:14.5px;white-space:nowrap}
.tabs button.on{background:#bdbdbd;color:#111}
.tabs button:hover:not(.on){color:#fff}
.sub{display:flex;background:#c2c2c2;flex:none;padding:0}
.sub button{padding:3px 18px;color:#555;font-size:14.5px;white-space:nowrap}
.sub button.on{background:var(--bl);color:#fff}
.body{flex:1;min-height:0;position:relative;overflow:hidden}

/* FA grid */
.fa{position:absolute;inset:0;overflow:auto;background:#000}
.fa table{border-collapse:separate;border-spacing:0;font-size:15px}
.fa th{background:#2a2a2a;font-weight:400;position:sticky;top:0;z-index:3;white-space:nowrap;padding:2px 8px;height:var(--rh);border-right:1px solid #444;color:#e6e6e6}
.fa tr.h2 th{top:var(--rh);background:#0d0d0d;border-bottom:1px solid #555;border-top:1px solid #555}
.fa th.c1{left:0;z-index:5;text-align:left;border-right:0}
.fa th.c2{left:30px;z-index:5;text-align:left;min-width:370px}
.fa td{height:var(--rh);padding:0 6px;white-space:nowrap;text-align:right}
.fa td.v{min-width:118px;border-left:1px solid #444;padding-right:2px}
.fa td.pc{min-width:76px;padding-right:6px;color:#dcdcdc}
.fa td.ic{position:sticky;left:0;background:#1c1c1c;z-index:2;width:30px;min-width:30px;text-align:center;padding:0}
.fa td.lb{position:sticky;left:30px;background:#1c1c1c;z-index:2;text-align:left;min-width:370px;max-width:370px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid #444;color:#e6e6e6}
.fa tr.g td{color:var(--a)}
.fa tr.g td.lb,.fa tr.g td.pc{color:var(--a)}
.fa tr:hover td{background:#10223f}
.fa tr:hover td.lb,.fa tr:hover td.ic{background:#14305e}
.fa .tg{font-style:normal;cursor:pointer;display:inline-block;width:18px;color:#ddd;font-size:11px}
.fa .ib{cursor:pointer;display:inline-block;vertical-align:middle}
.fa .ib:hover rect{fill:#8fd0ff}
.fanav{position:absolute;left:0;right:0;bottom:0;height:30px;background:#000;display:flex;gap:10px;padding:3px 8px;z-index:6}
.fanav button{width:84px;background:#2a2a2a;border:1px solid #444;color:#ddd;font-size:15px}
.fanav button:hover{background:#3a3a3a}
.fa{bottom:30px}

/* panels */
.gr{display:grid;gap:3px;height:100%;padding:3px;background:#000}
.pn{background:#050505;border:1px solid #333;display:flex;flex-direction:column;min-height:0;min-width:0}
.pn>h4{display:flex;justify-content:space-between;gap:8px;background:#1b1b1b;color:var(--a);font-weight:500;padding:2px 8px;font-size:12px;border-bottom:1px solid #333;white-space:nowrap}
.pn>h4 u{text-decoration:none;color:var(--g);font-weight:400}
.pn>h4 span.r{display:flex;gap:10px}
.pn>h4 button{color:#aaa;font-size:11px;padding:0 4px}
.pn>h4 button.on{background:var(--bl);color:#fff}
.pb{flex:1;min-height:0;position:relative;overflow:auto}
.pb.fx{overflow:hidden}
.ch{position:absolute;inset:0}
.ch svg{position:absolute;inset:0}
.hit .hl{opacity:0;pointer-events:none}.hit:hover .hl{opacity:1}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{position:sticky;top:0;background:#171717;color:#b9b9b9;font-weight:400;text-align:left;padding:2px 8px;white-space:nowrap;border-bottom:1px solid #333;cursor:pointer;z-index:2}
.dt th:hover{color:var(--a)}
.dt td{padding:0 8px;height:var(--rh);border-bottom:1px solid #141414;white-space:nowrap}
.dt .r{text-align:right}.dt .c{text-align:center}
.dt tr:hover td{background:#10223f}
.dt tr.sel td{background:#173a78}
.mb{display:inline-block;width:46px;height:6px;background:#222;vertical-align:middle;margin-right:6px}
.mb i{display:block;height:100%;background:var(--a)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0 14px;padding:4px 8px;font-size:12px}
.kv>*{height:var(--rh);display:flex;align-items:center;border-bottom:1px solid #131313}
.kv>:nth-child(odd){color:var(--g)}
.kv>:nth-child(even){justify-content:flex-end;text-align:right}
.hm{display:grid;gap:2px;padding:6px;font-size:11px}
.hm b{font-weight:400;color:var(--g);text-align:center}
.hm span{height:20px;display:grid;place-items:center;color:#fff}
.lst{list-style:none}
.lst li{display:flex;gap:10px;padding:3px 8px;border-bottom:1px solid #141414;font-size:12px}
.lst li:hover{background:#10223f}
.lst time{color:var(--g);margin-left:auto;white-space:nowrap}
.big{font-size:44px;color:var(--a);padding:10px 12px 0;line-height:1}
.desc{padding:8px 10px;font-size:12.5px;line-height:1.45;color:#e2e2e2}
.desc h2{font-size:15px;color:var(--a);font-weight:500;margin-bottom:4px}
.desc small{color:var(--g)}
.pg{display:grid;gap:0}

/* news */
#news{background:var(--nb);font-size:16px;line-height:1.3;height:auto;overflow:hidden;position:relative;z-index:20}
#news .hd{text-align:right;color:#a7b2d6;padding:2px 14px;font-size:15px;background:#071a66}
#news .hd button{color:#bfc8e6;margin-left:18px}
#news .hd button:hover{color:#fff}
#nl div{display:flex;gap:18px;padding:0 10px;white-space:nowrap;overflow:hidden}
#nl .s{color:#c9a85a;width:46px;flex:none;text-align:right}
#nl .m{color:#c8d1f0;flex:none}
#nl .x{color:#f0e2b0;overflow:hidden;text-overflow:ellipsis}
#nl div:first-child .x{color:#fff}
#news.big #nl{max-height:46vh;overflow:auto}

/* overlays */
#mn{position:fixed;z-index:90;background:#191919;border:1px solid #666;min-width:220px;display:none;max-height:70vh;overflow:auto}
#mn.on{display:block}
#mn button{display:block;width:100%;text-align:left;padding:4px 12px;font-size:13px;white-space:nowrap}
#mn button:hover{background:var(--bl)}
#ovl{position:fixed;z-index:95;right:14px;top:96px;width:min(560px,94vw);max-height:78vh;overflow:auto;background:#0b0b0b;border:1px solid var(--a);display:none}
#ovl.on{display:block}
#ovl h3{display:flex;justify-content:space-between;background:#1f1f1f;color:var(--a);font-weight:500;padding:4px 10px}
#ovl h3 button{color:#fff}
#ovl .in{padding:8px 12px;font-size:13px}
#ovl .rw{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px solid #1a1a1a}
#ovl select{background:#222;border:1px solid #555;padding:1px 6px}
#pop{position:fixed;z-index:92;left:50%;top:18vh;transform:translateX(-50%);width:min(720px,94vw);height:330px;background:#070707;border:1px solid var(--a);display:none;flex-direction:column}
#pop.on{display:flex}
#pop h3{display:flex;justify-content:space-between;background:#1f1f1f;color:var(--a);font-weight:500;padding:4px 10px}
#pop h3 button{color:#fff}
#pop .pb{padding:0}
#tip{position:fixed;z-index:120;pointer-events:none;background:#000;border:1px solid var(--a);color:#fff;padding:4px 8px;font-size:11.5px;opacity:0;max-width:300px}
#tip b{font-weight:500;color:var(--a)}
#tip i{display:inline-block;width:8px;height:8px;margin-right:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;border:1px solid var(--a);color:var(--a);padding:6px 16px;z-index:130;display:none}
#toast.on{display:block}
.flash{animation:fl .6s}
@keyframes fl{from{background:#3b2a00}to{background:transparent}}
@media (max-width:1100px){#tick1{font-size:18px}#tick1 .ba,#tick1 .qs{font-size:16px}#tick2{font-size:14px;gap:12px}#bar2 .id{min-width:0}.fld.sec{min-width:150px}.hide-s{display:none!important}.sr{font-size:12px;gap:8px}.tabs button,.sub button{font-size:12px;padding:3px 10px}#news{font-size:12px}}
</style>
</head>
<body>
<div id="t">
  <div id="bar1"></div>
  <div id="tick1"></div>
  <div id="tick2"></div>
  <div id="bar2"></div>
  <div id="main"></div>
  <div id="news"></div>
</div>
<div id="mn"></div>
<div id="ovl"></div>
<div id="pop"></div>
<div id="tip"></div>
<div id="toast"></div>

<script>
/* ========== utils ========== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(77),ri=(a,b)=>Math.floor(a+R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)];
const hh=(i,j)=>{const x=Math.sin(i*12.9898+j*78.233)*43758.5453;return x-Math.floor(x)};
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+f(x),0);
const N=(v,d=1)=>v==null||!isFinite(v)?'—':(v<0&&Math.abs(v)>=Math.pow(10,-d)/2?'-':'')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const nf=v=>{const a=Math.abs(v);return a>=1e9?N(v/1e9,1)+'B':a>=1e6?N(v/1e6,1)+'M':a>=1e4?N(v/1e3,0)+'K':a>=100?N(v,0):N(v,a<10?2:1)};
const pad=n=>String(n).padStart(2,'0');
const hms=d=>pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const sgn=(v,d=1,s='')=>`<b class="${v>=0?'up':'dn'}" style="font-weight:400">${v>=0?'+':''}${N(v,d)}${s}</b>`;
const cc=(v,good=1)=>(v>=0)===(good>0)?'up':'dn';

const CUR={USD:1,EUR:.92,GBP:.79};
const ENT={'NULLA CO/THE Equity':{f:1,id:'NL OPS Equity'},'NULLA NA Region':{f:.38,id:'NL NA Region'},'NULLA EU Region':{f:.34,id:'NL EU Region'},'NULLA APAC Region':{f:.19,id:'NL APAC Region'},'NULLA ME Region':{f:.09,id:'NL ME Region'}};
const st={fn:'FA',tab:6,sub:11,kind:'Annuals',n:10,cur:'USD',ent:'NULLA CO/THE Equity',col:{},hist:['FA'],hi:0,pct:true,cp:false,cust:['rev','gp','ebitda','ni','orders','ret'],des:1,star:false};
const mv=v=>v*CUR[st.cur]*ENT[st.ent].f,sc=()=>ENT[st.ent].f;
const CAT=['Outerwear','Knitwear','Tailoring','Shirting','Leather Goods'];
const REGN=['North America','Europe','Asia-Pacific','Middle East','Other'];
const CHN=['Web','Mobile App','Retail Stores','Marketplaces','Wholesale'];

/* ========== charts ========== */
const COL=['#ffa21f','#42c6ff','#ececec','#2fd35f','#ff4b43','#ffd60a'];
const CH=[];const ch=fn=>{CH.push(fn);return`<div class="ch" data-c="${CH.length-1}"></div>`};
function paint(root=document){$$('.ch',root).forEach(e=>{const f=CH[e.dataset.c];if(f&&e.clientWidth>30&&e.clientHeight>30)e.innerHTML=f(e.clientWidth,e.clientHeight)})}
function nice(mn,mx,c=4){const raw=(mx-mn)/c||1,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,s=(f<=1?1:f<=2?2:f<=5?5:10)*p;const lo=Math.floor(mn/s)*s,hi=Math.ceil(mx/s)*s,t=[];for(let v=lo;v<=hi+1e-9;v+=s)t.push(v);return{lo,hi,t}}
const tr=(c,n,v)=>`<div><i style="background:${c}"></i>${n}: <b>${v}</b></div>`;
function frame(w,h,o,n,x,lo,hi,t,pl,pr,pt,pb){
  const y=v=>pt+(h-pt-pb)-(v-lo)/(hi-lo)*(h-pt-pb);let s='';
  t.forEach(v=>s+=`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#222"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${(o.yf||nf)(v)}</text>`);
  const ev=Math.max(1,Math.ceil(n/Math.max(2,Math.floor((w-pl-pr)/56))));
  for(let i=0;i<n;i+=ev)s+=`<text x="${x(i)}" y="${h-5}" text-anchor="middle">${o.labels[i]}</text>`;
  return{s,y};
}
function line(w,h,o){
  const pl=o.pl||42,pr=8,pt=6,pb=17,iw=w-pl-pr,n=o.labels.length,all=o.series.flatMap(s=>s.data);
  const{lo,hi,t}=nice(o.zero===false?Math.min(...all)*.97:0,Math.max(...all)*1.03),x=i=>pl+(n>1?i*iw/(n-1):iw/2);
  const f=frame(w,h,o,n,x,lo,hi,t,pl,pr,pt,pb),y=f.y;let s=`<svg width="${w}" height="${h}">`+f.s;
  o.series.forEach((se,k)=>{const c=se.c||COL[k%6],d=se.data.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
    if(se.area)s+=`<path d="${d}L${x(n-1)} ${y(lo)}L${x(0)} ${y(lo)}Z" fill="${c}" opacity=".13"/>`;
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${se.w||1.4}" ${se.dash?'stroke-dasharray="3 3"':''}/>`});
  for(let i=0;i<n;i++){const tip=`<b>${o.labels[i]}</b>`+o.series.map((se,k)=>tr(se.c||COL[k%6],se.name,(o.fmt||nf)(se.data[i]))).join('');
    s+=`<g class="hit"><rect x="${x(i)-iw/n/2}" y="${pt}" width="${iw/n}" height="${h-pt-pb}" fill="transparent" data-tip="${esc(tip)}"/><line class="hl" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${h-pb}" stroke="#ffa21f" stroke-dasharray="2 2"/></g>`}
  return s+'</svg>';
}
function bars(w,h,o){
  const pl=o.pl||42,pr=6,pt=6,pb=17,iw=w-pl-pr,n=o.labels.length,m=o.series.length,stk=o.stacked;
  const tot=o.labels.map((_,i)=>stk?sum(o.series,s=>Math.max(0,s.data[i])):Math.max(...o.series.map(s=>s.data[i])));
  const mn=Math.min(0,...o.series.flatMap(s=>s.data)),{lo,hi,t}=nice(mn,Math.max(...tot)*1.04),band=iw/n,xc=i=>pl+band*i+band/2,bw=stk?Math.min(band*.7,40):Math.min(band*.78/m,24);
  const f=frame(w,h,o,n,xc,lo,hi,t,pl,pr,pt,pb),y=f.y;let s=`<svg width="${w}" height="${h}">`+f.s;
  for(let i=0;i<n;i++){let acc=0;const tip=`<b>${o.labels[i]}</b>`+o.series.map((se,k)=>tr(se.c||COL[k%6],se.name,(o.fmt||nf)(se.data[i]))).join('');
    s+=`<g class="hit"><rect class="hl" x="${pl+band*i}" y="${pt}" width="${band}" height="${h-pt-pb}" fill="#fff" opacity=".07"/>`;
    o.series.forEach((se,k)=>{const v=se.data[i],c=se.c||COL[k%6];
      if(stk){s+=`<rect x="${xc(i)-bw/2}" y="${y(acc+v)}" width="${bw}" height="${Math.max(0,y(acc)-y(acc+v)-1)}" fill="${c}"/>`;acc+=v}
      else s+=`<rect x="${xc(i)-bw*m/2+k*bw}" y="${v>=0?y(v):y(0)}" width="${bw-1}" height="${Math.max(1,Math.abs(y(v)-y(0)))}" fill="${c}"/>`});
    s+=`<rect x="${pl+band*i}" y="${pt}" width="${band}" height="${h-pt-pb}" fill="transparent" data-tip="${esc(tip)}"/></g>`}
  if(o.line)s+=`<path d="${o.line.data.map((v,i)=>(i?'L':'M')+xc(i)+' '+y(v)).join('')}" fill="none" stroke="#ececec" stroke-width="1.4"/>`;
  return s+'</svg>';
